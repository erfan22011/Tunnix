name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Verify Permanent Release Keystore
        run: |
          if [ -f release.keystore ]; then
            echo "Permanent release.keystore found in repository."
          else
            echo "ERROR: release.keystore not found!"
            exit 1
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Download Xray Core AAR
        run: |
          mkdir -p libv2ray
          if [ ! -f libv2ray/libv2ray.aar ]; then
            echo "Downloading libv2ray.aar (Xray native core)..."
            curl -L -o libv2ray/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
          fi

      - name: Build Release APKs with ABI Splits
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release build failed: Required GitHub Secrets (KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are not set!"
            exit 1
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          ./gradlew assembleRelease --stacktrace

      - name: Organize, Sign & Verify Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          mkdir -p release-artifacts
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              echo "Signing APK with apksigner (v1, v2, v3): $apk"
              $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
                --ks release.keystore \
                --ks-pass env:KEYSTORE_PASSWORD \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass env:KEY_PASSWORD \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "$apk"

              echo "Verifying signature and alignment for: $apk"
              $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$apk"
              
              filename=$(basename "$apk")
              echo "Processing $filename..."
              if [[ "$filename" == *"arm64-v8a"* ]]; then
                cp "$apk" "release-artifacts/Tunnix-${{ github.ref_name }}-arm64-v8a.apk"
              elif [[ "$filename" == *"armeabi-v7a"* ]]; then
                cp "$apk" "release-artifacts/Tunnix-${{ github.ref_name }}-armeabi-v7a.apk"
              elif [[ "$filename" == *"universal"* ]]; then
                cp "$apk" "release-artifacts/Tunnix-${{ github.ref_name }}-universal.apk"
              fi
            fi
          done
          echo "Generated Release Artifacts:"
          ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          name: "Tunnix ${{ github.ref_name }}"
          body: |
            ## Tunnix - Freedom, One Tap Away
            Official Release **${{ github.ref_name }}**

            ### 📦 بسته های دانلودی تفکیک‌شده (Download Packages):
            * **Tunnix-${{ github.ref_name }}-arm64-v8a.apk**: برای تمامی گوشی‌های مدرن اندروید ۶۴ بیتی (بهینه‌ترین و سبک‌ترین نسخه - توصیه شده)
            * **Tunnix-${{ github.ref_name }}-armeabi-v7a.apk**: برای گوشی‌های قدیمی‌تر اندروید (۳۲ بیتی)
            * **Tunnix-${{ github.ref_name }}-universal.apk**: نسخه کامل یونیورسال سازگار با تمامی پردازنده‌ها

            ### ✨ تغییرات این نسخه (${{ github.ref_name }}):
            1. **حذف کامل گزینه بای‌پس ایران و یکپارچه‌سازی ترافیک تونل VPN**: طبق درخواست کاربر، گزینه بای‌پس ایران به طور کامل از بخش تنظیمات و ساختار برنامه پاک گردید و تمامی ترافیک اینترنت به طور پایدار و رمزنگاری‌شده از طریق تونل VPN مسیریابی می‌شود.
            2. **رفع قطعی کلیه باگ‌ها و تضمین پایداری اجرایی (Crash-Free)**: تثبیت کلیدهای امنیتی محلی با الگوریتم‌های ضدخطا و ایزولاسیون کامل رخدادها در تمامی چرخه‌های حیات برنامه.
            3. **رابط کاربری نرم و مدرن در صفحه ورود (Redeem Screen)**: فیدبک لمسی ارتجاعی، انحنای نرم ۲۶ دی‌پی، جای‌گذاری سریع و لودینگ بدون صفحه سیاه.
