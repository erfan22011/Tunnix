name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Release Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release build failed: Required GitHub Secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are not set!"
            exit 1
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          chmod 600 /tmp/release.keystore
          echo "KEYSTORE_FILE=/tmp/release.keystore" >> $GITHUB_ENV

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Download Xray Core AAR
        run: |
          mkdir -p libv2ray
          if [ ! -f libv2ray/libv2ray.aar ]; then
            echo "Downloading libv2ray.aar (Xray native core)..."
            curl -L -o libv2ray/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
          fi

      - name: Build Release APKs with ABI Splits
        env:
          KEYSTORE_FILE: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Organize, Sign & Verify Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          mkdir -p release-artifacts
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              echo "Signing APK with apksigner (v1, v2, v3): $apk"
              $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
                --ks /tmp/release.keystore \
                --ks-pass env:KEYSTORE_PASSWORD \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass env:KEY_PASSWORD \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "$apk"

              echo "Verifying signature and alignment for: $apk"
              $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$apk"
              
              filename=$(basename "$apk")
              echo "Processing $filename..."
              if [[ "$filename" == *"arm64-v8a"* ]]; then
                cp "$apk" "release-artifacts/Tunnix-${{ github.ref_name }}-arm64-v8a.apk"
              elif [[ "$filename" == *"armeabi-v7a"* ]]; then
                cp "$apk" "release-artifacts/Tunnix-${{ github.ref_name }}-armeabi-v7a.apk"
              elif [[ "$filename" == *"universal"* ]]; then
                cp "$apk" "release-artifacts/Tunnix-${{ github.ref_name }}-universal.apk"
              fi
            fi
          done
          # Securely wipe temporary keystore from runner disk
          rm -f /tmp/release.keystore
          echo "Generated Release Artifacts:"
          ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          name: "Tunnix ${{ github.ref_name }}"
          body: |
            ## Tunnix - Freedom, One Tap Away
            Official Release **${{ github.ref_name }}**

            > ⚠️ **نکته بسیار مهم برای کاربران:** با توجه به ارتقا و چرخش امنیتی کلید امضای رسمی برنامه به RSA 4096-bit، برای نصب نسخه جدید ${{ github.ref_name }} لازم است **ابتدا نسخه قبلی را از روی گوشی حذف (Uninstall) کرده** و سپس نسخه جدید را نصب فرمایید.

            ### 📦 بسته‌های دانلودی تفکیک‌شده (Download Packages):
            * **Tunnix-${{ github.ref_name }}-arm64-v8a.apk**: برای تمامی گوشی‌های مدرن اندروید ۶۴ بیتی (بهینه‌ترین و سبک‌ترین نسخه - توصیه شده)
            * **Tunnix-${{ github.ref_name }}-armeabi-v7a.apk**: برای گوشی‌های قدیمی‌تر اندروید (۳۲ بیتی)
            * **Tunnix-${{ github.ref_name }}-universal.apk**: نسخه کامل یونیورسال سازگار با تمامی پردازنده‌ها

            ### 🛡️ مهم‌ترین ارتقاها و تغییرات امنیتی و ساختاری (${{ github.ref_name }}):
            1. **چرخش کلید امضا و ایزولاسیون کامل CI/CD**: امضای رسمی با کلید ۴۰۹۶ بیتی امن و حذف کلیه سکرت‌ها از تاریخچه عمومی ریپازیتوری.
            2. **مسدودسازی پورت‌های بدون احراز هویت محلی**: غیرفعال‌سازی اینباندهای باز محلی و هدایت ترافیک صرفاً از طریق TUN Interface جهت مقابله با سرقت پروکسی توسط اپلیکیشن‌های محلی.
            3. **حذف ریشه‌ای گزینه بای‌پس ایران**: عبور ۱۰۰ درصدی تمام ترافیک اینترنت از داخل تونل پروکسی و پاک‌سازی کامل از تمامی لایه‌ها و رابط کاربری.
            4. **مقابله با SSRF و سرقت سابسکریپشن**: اعمال محدودیت ۲ مگابایت، جلوگیری از ریدایرکت‌های ناامن و اعتبارسنجی دامنه‌ها و توکن‌ها.
            5. **ارتقای رمزنگاری محلی به معماری Fail-Closed**: پاک‌سازی اطلاعات در صورت خطای احراز اصالت و حذف کلید پیش‌فرض.
            6. **بهینه‌سازی شبکه و ثبات فریم‌ورک**: تنظیم MTU روی 1400، یکتاسازی سرورها، مقابله با ReDoS و ارتقای مدیریت چرخه حیات سرویس VPN.
            7. **پایش سلامت و راستی‌آزمایی هسته Xray**: پین‌کردن چک‌سام SHA-256 فایل باینری `libv2ray.aar` و حفظ سازگاری ۱۰۰ درصدی پروتکل‌های VLESS/XHTTP بر روی پورت‌های 2053 و 6793.
